<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Visit Scheduler - Admin</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Simple icon components
    const Calendar = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    );
    
    const Clock = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    );
    
    const CheckCircle = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    );
    
    const XCircle = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    );
    
    const List = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    );
    
    function HomeVisitScheduler() {
      const [selectedDate, setSelectedDate] = useState('');
      const [selectedTime, setSelectedTime] = useState('');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [notes, setNotes] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [errors, setErrors] = useState({});
      const [showAdmin, setShowAdmin] = useState(false);
      const [appointments, setAppointments] = useState([]);
      const [loading, setLoading] = useState(false);
      const [bookedDates, setBookedDates] = useState([]);
      const [showEvaluationForm, setShowEvaluationForm] = useState(false);
      const [evaluationType, setEvaluationType] = useState(null);
      const [evaluations, setEvaluations] = useState([]);
      const [showEvaluationsList, setShowEvaluationsList] = useState(false);
      
      // Form data for evaluations
      const [staffFormData, setStaffFormData] = useState({
        familyName: '', clientName: '', staffName: '', evaluationDate: new Date().toISOString().split('T')[0],
        serviceTypes: { homemaker: false, personalCare: false, communityConnection: false, supportedCommunityConnection: false, respite: false, mentorship: false },
        responses: {q1:'',q2:'',q3:'',q4:'',q5:'',q6:'',q7:'',q8:'',q9:'',q10:'',q11:'',q12:'',q13:'',q14:''},
        rating: '', incidents: '', concerns: '', evaluatorName: '', evaluatorSignature: ''
      });
      
      const [parentalFormData, setParentalFormData] = useState({
        parentName: '', clientName: '', providerName: '', evaluationDate: new Date().toISOString().split('T')[0],
        serviceTypes: { homemaker: false, personalCare: false, communityConnection: false, supportedCommunityConnection: false, respite: false, mentorship: false },
        responses: {q1:'',q2:'',q2desc:'',q3:'',q4:'',q5:'',q6:'',q7:'',q8:'',q9:'',q10:''},
        complaints: '', suggestions: '', evaluatorName: '', evaluatorSignature: ''
      });

      // Check URL for admin access
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('admin') === 'true') {
          setShowAdmin(true);
        }
      }, []);

      // Load booked dates on component mount
      useEffect(() => {
        fetchBookedDates();
      }, []);

      const fetchBookedDates = async () => {
        try {
          const response = await fetch(API_URL);
          if (response.ok) {
            const data = await response.json();
            // Get all pending and confirmed appointment dates (not declined)
            const booked = data
              .filter(apt => apt.status === 'confirmed' || apt.status === 'pending')
              .map(apt => apt.requestedDate);
            console.log('Booked dates loaded:', booked);
            setBookedDates(booked);
          }
        } catch (error) {
          console.error('Error fetching booked dates:', error);
        }
      };

      // API URL - Railway production backend
      const API_URL = 'https://visit-scheduler-production-a96c.up.railway.app/api/appointments';
      const EVALUATIONS_API_URL = 'https://visit-scheduler-production-a96c.up.railway.app/api/evaluations';

      // Load appointments from API when admin panel is opened
      useEffect(() => {
        if (showAdmin) {
          fetchAppointments();
        }
      }, [showAdmin]);

      const fetchAppointments = async () => {
        try {
          setLoading(true);
          const response = await fetch(API_URL);
          if (response.ok) {
            const data = await response.json();
            setAppointments(data);
          } else {
            console.error('Failed to fetch appointments');
            alert('Could not connect to server. Make sure the backend is running.');
          }
        } catch (error) {
          console.error('Error fetching appointments:', error);
          alert('Could not connect to server. Make sure the backend is running.');
        } finally {
          setLoading(false);
        }
      };

      // Get minimum date (today) and maximum date (3 months from now)
      const today = new Date().toISOString().split('T')[0];
      const maxDate = new Date();
      maxDate.setMonth(maxDate.getMonth() + 3);
      const maxDateStr = maxDate.toISOString().split('T')[0];

      const validateForm = () => {
        const newErrors = {};
        
        if (!name.trim()) newErrors.name = 'Name is required';
        if (!email.trim()) {
          newErrors.email = 'Email is required';
        } else if (!/\S+@\S+\.\S+/.test(email)) {
          newErrors.email = 'Email is invalid';
        }
        if (!phone.trim()) newErrors.phone = 'Phone number is required';
        if (!address.trim()) newErrors.address = 'Address is required';
        if (!selectedDate) newErrors.date = 'Please select a date';
        if (!selectedTime) newErrors.time = 'Please select a time';

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (validateForm()) {
          try {
            setLoading(true);
            const response = await fetch(API_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                name,
                email,
                phone,
                address,
                requestedDate: selectedDate,
                requestedTime: selectedTime,
                notes
              })
            });

            if (response.ok) {
              setIsSubmitted(true);
            } else {
              alert('Failed to submit appointment. Please try again.');
            }
          } catch (error) {
            console.error('Error submitting appointment:', error);
            alert('Could not connect to server. Make sure the backend is running.');
          } finally {
            setLoading(false);
          }
        }
      };

      const handleReset = () => {
        setSelectedDate('');
        setSelectedTime('');
        setName('');
        setEmail('');
        setPhone('');
        setAddress('');
        setNotes('');
        setIsSubmitted(false);
        setErrors({});
      };

      const updateAppointmentStatus = async (id, newStatus) => {
        try {
          const response = await fetch(`${API_URL}/${id}/status`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ status: newStatus })
          });

          if (response.ok) {
            // Refresh appointments list
            fetchAppointments();
          } else {
            alert('Failed to update appointment status');
          }
        } catch (error) {
          console.error('Error updating appointment:', error);
          alert('Could not connect to server');
        }
      };

      const deleteAppointment = async (id) => {
        if (!confirm('Are you sure you want to delete this appointment?')) {
          return;
        }

        try {
          const response = await fetch(`${API_URL}/${id}`, {
            method: 'DELETE'
          });

          if (response.ok) {
            // Refresh appointments list
            fetchAppointments();
          } else {
            alert('Failed to delete appointment');
          }
        } catch (error) {
          console.error('Error deleting appointment:', error);
          alert('Could not connect to server');
        }
      };

      const formatDate = (dateString) => {
        if (!dateString) return '';
        // Parse YYYY-MM-DD string to avoid timezone issues
        const [year, month, day] = dateString.split('-').map(Number);
        const date = new Date(year, month - 1, day);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return date.toLocaleDateString('en-US', options);
      };

      const formatDateTime = (isoString) => {
        const date = new Date(isoString);
        return date.toLocaleString('en-US', { 
          month: 'short', 
          day: 'numeric', 
          year: 'numeric',
          hour: '2-digit', 
          minute: '2-digit' 
        });
      };

      const formatTime = (timeString) => {
        if (!timeString) return '';
        // Handle both string format (HH:MM:SS) and Date object
        let timeStr = timeString;
        if (typeof timeString === 'object' && timeString.getHours) {
          // It's a Date object, extract time
          const hours = timeString.getHours();
          const minutes = timeString.getMinutes();
          timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
        }
        const [hours, minutes] = timeStr.split(':');
        const hour = parseInt(hours);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const displayHour = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
        return `${displayHour}:${minutes} ${ampm}`;
      };

      const exportToCSV = () => {
        const headers = ['Name', 'Email', 'Phone', 'Address', 'Requested Date', 'Requested Time', 'Notes', 'Status', 'Submitted At'];
        const rows = appointments.map(apt => [
          apt.name,
          apt.email,
          apt.phone,
          apt.address,
          apt.requestedDate,
          apt.requestedTime || '',
          apt.notes || '',
          apt.status,
          formatDateTime(apt.submittedAt)
        ]);

        const csvContent = [
          headers.join(','),
          ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
        ].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `appointments_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      // Load evaluations
      const fetchEvaluations = async () => {
        try {
          const response = await fetch(EVALUATIONS_API_URL);
          if (response.ok) {
            const data = await response.json();
            setEvaluations(data);
          }
        } catch (error) {
          console.error('Error fetching evaluations:', error);
        }
      };

      useEffect(() => {
        if (showAdmin) {
          fetchEvaluations();
        }
      }, [showAdmin]);

      // Submit evaluation
      const submitEvaluation = async (evaluationData) => {
        try {
          const response = await fetch(EVALUATIONS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(evaluationData)
          });

          if (response.ok) {
            alert('Evaluation submitted successfully!');
            setShowEvaluationForm(false);
            setEvaluationType(null);
            fetchEvaluations();
          } else {
            alert('Failed to submit evaluation');
          }
        } catch (error) {
          console.error('Error submitting evaluation:', error);
          alert('Error submitting evaluation');
        }
      };

      // Delete evaluation
      const deleteEvaluation = async (id) => {
        if (!confirm('Are you sure you want to delete this evaluation?')) return;
        
        try {
          const response = await fetch(`${EVALUATIONS_API_URL}/${id}`, {
            method: 'DELETE'
          });
          if (response.ok) {
            fetchEvaluations();
          }
        } catch (error) {
          console.error('Error deleting evaluation:', error);
        }
      };

      // Evaluation Forms (check BEFORE admin panel to allow forms to show)
      if (showEvaluationForm && evaluationType === 'staff_service') {
        const questions = [
          "Does the staff consistently arrive on time?",
          "Does the staff call if they are unable to make it?",
          "Does the staff treat your family or loved one with respect?",
          "Is your staff's attitude positive and supportive?",
          "Does the staff listen to your needs and follow your care plan?",
          "Does your staff keep your home clean and organized during the visit?",
          "Do you feel safe with the staff in your home?",
          "Is the staff helpful in meeting daily living goals?",
          "Does the staff encourage independence when appropriate?",
          "Does the staff communicate clearly with you or your coordinator?",
          "Are you satisfied with the quality of service provided?",
          "Does the staff check in or check out through the EVV app regularly?",
          "Do you have any issues with how services are being documented?",
          "Would you recommend this staff member to others?"
        ];

        const handleSubmitStaffEval = async (e) => {
          e.preventDefault();
          const selectedServices = Object.keys(staffFormData.serviceTypes).filter(k => staffFormData.serviceTypes[k]).map(k => k.replace(/([A-Z])/g, ' $1').trim()).join(', ');
          await submitEvaluation({
            evaluation_type: 'staff_service', evaluator_name: staffFormData.evaluatorName, evaluator_signature: staffFormData.evaluatorSignature,
            client_name: staffFormData.clientName, service_provider_name: staffFormData.staffName, evaluation_date: staffFormData.evaluationDate,
            service_types: selectedServices, responses: { familyName: staffFormData.familyName, ...staffFormData.responses, rating: staffFormData.rating, incidents: staffFormData.incidents, concerns: staffFormData.concerns }
          });
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 overflow-y-auto">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-8 my-8">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-3xl font-bold text-gray-800">Staff/Service Evaluation Form</h2>
                <button onClick={() => {setShowEvaluationForm(false); setEvaluationType(null);}} className="text-gray-500 hover:text-gray-700">
                  <XCircle className="w-6 h-6" />
                </button>
              </div>
              <form onSubmit={handleSubmitStaffEval} className="space-y-6">
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Family Name *</label>
                    <input type="text" value={staffFormData.familyName} onChange={(e) => setStaffFormData({...staffFormData, familyName: e.target.value})} required className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Client Name *</label>
                    <input type="text" value={staffFormData.clientName} onChange={(e) => setStaffFormData({...staffFormData, clientName: e.target.value})} required className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Staff Name *</label>
                    <input type="text" value={staffFormData.staffName} onChange={(e) => setStaffFormData({...staffFormData, staffName: e.target.value})} required className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Date of Evaluation *</label>
                    <input type="date" value={staffFormData.evaluationDate} onChange={(e) => setStaffFormData({...staffFormData, evaluationDate: e.target.value})} required className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                </div>
                <div><label className="block text-sm font-medium text-gray-700 mb-3">Service Types *</label>
                  <div className="grid grid-cols-2 gap-3">
                    {['homemaker', 'personalCare', 'communityConnection', 'supportedCommunityConnection', 'respite', 'mentorship'].map(type => (
                      <label key={type} className="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" checked={staffFormData.serviceTypes[type]} onChange={() => setStaffFormData(prev => ({...prev, serviceTypes: {...prev.serviceTypes, [type]: !prev.serviceTypes[type]}}))} className="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded"/>
                        <span className="text-gray-700 capitalize">{type.replace(/([A-Z])/g, ' $1').trim()}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <div className="space-y-4"><h3 className="text-xl font-semibold text-gray-800">Evaluation Questions</h3>
                  {questions.map((q, i) => (
                    <div key={i} className="bg-gray-50 p-4 rounded-lg">
                      <p className="font-medium text-gray-700 mb-3">{i+1}. {q}</p>
                      <div className="flex gap-4">
                        {['Yes', 'No', 'Sometimes'].map(opt => (
                          <label key={opt} className="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name={`q${i+1}`} value={opt} checked={staffFormData.responses[`q${i+1}`] === opt} onChange={(e) => setStaffFormData(prev => ({...prev, responses: {...prev.responses, [`q${i+1}`]: e.target.value}}))} required className="w-4 h-4 text-indigo-600"/>
                            <span className="text-gray-700">{opt}</span>
                          </label>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="bg-indigo-50 p-4 rounded-lg">
                  <label className="block text-sm font-medium text-gray-700 mb-3">Overall Rating *</label>
                  <div className="flex gap-3">
                    {[1,2,3,4,5].map(n => (
                      <label key={n} className="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="rating" value={n} checked={staffFormData.rating === n.toString()} onChange={(e) => setStaffFormData({...staffFormData, rating: e.target.value})} required className="w-4 h-4 text-indigo-600"/>
                        <span className="text-gray-700 font-semibold">{n}</span>
                      </label>
                    ))}
                    <span className="text-sm text-gray-500 ml-2">(1 = Poor, 5 = Excellent)</span>
                  </div>
                </div>
                <div><label className="block text-sm font-medium text-gray-700 mb-2">Incidents or Concerns</label>
                  <textarea value={staffFormData.incidents} onChange={(e) => setStaffFormData({...staffFormData, incidents: e.target.value})} rows="3" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                <div><label className="block text-sm font-medium text-gray-700 mb-2">Areas for Improvement</label>
                  <textarea value={staffFormData.concerns} onChange={(e) => setStaffFormData({...staffFormData, concerns: e.target.value})} rows="3" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Evaluator Name *</label>
                    <input type="text" value={staffFormData.evaluatorName} onChange={(e) => setStaffFormData({...staffFormData, evaluatorName: e.target.value})} required className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Signature *</label>
                    <input type="text" value={staffFormData.evaluatorSignature} onChange={(e) => setStaffFormData({...staffFormData, evaluatorSignature: e.target.value})} required placeholder="Type your name" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"/></div>
                </div>
                <div className="flex gap-3 pt-4">
                  <button type="submit" className="flex-1 bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">Submit Evaluation</button>
                  <button type="button" onClick={() => {setShowEvaluationForm(false); setEvaluationType(null);}} className="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      if (showEvaluationForm && evaluationType === 'parental_provider') {
        const questions = [
          {q: "Do you feel the services you provide are helping your child/family reach goals and maintain daily stability?", opts: ['Yes', 'No', 'Somewhat']},
          {q: "Since you began providing these services, have you noticed improvement in your child's or family's overall well-being?", opts: ['Yes', 'No', 'Not sure'], hasDesc: true},
          {q: "Does our agency provide the support, guidance, and resources you need to continue your role as a parental provider?", opts: ['Always', 'Sometimes', 'Rarely']},
          {q: "Is your assigned coordinator helpful and available when you have questions or need assistance?", opts: ['Yes', 'No', 'Sometimes']},
          {q: "Are your questions about timesheets, billing, or EVV check-in/check-out answered promptly?", opts: ['Yes', 'No', 'Sometimes']},
          {q: "Do you find the EVV app (check-in/check-out process) easy to use?", opts: ['Yes', 'No', 'Sometimes', 'Needs improvement']},
          {q: "How would you describe your compensation?", opts: ['Great', 'Fair', 'Unfair', 'Needs improvement']},
          {q: "Do you believe the allotted service hours are enough to meet your client's needs?", opts: ['Yes', 'No', 'Not sure']},
          {q: "Would you like to continue providing services as a parental provider?", opts: ['Yes', 'No', 'Undecided']},
          {q: "Overall, how would you rate the quality of services and agency support?", opts: ['1 (Poor)', '2', '3', '4', '5 (Excellent)']}
        ];

        const handleSubmitParentalEval = async (e) => {
          e.preventDefault();
          const selectedServices = Object.keys(parentalFormData.serviceTypes).filter(k => parentalFormData.serviceTypes[k]).map(k => k.replace(/([A-Z])/g, ' $1').trim()).join(', ');
          await submitEvaluation({
            evaluation_type: 'parental_provider', evaluator_name: parentalFormData.evaluatorName, evaluator_signature: parentalFormData.evaluatorSignature,
            client_name: parentalFormData.clientName, service_provider_name: parentalFormData.providerName, evaluation_date: parentalFormData.evaluationDate,
            service_types: selectedServices, responses: { parentName: parentalFormData.parentName, ...parentalFormData.responses, complaints: parentalFormData.complaints, suggestions: parentalFormData.suggestions }
          });
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-purple-50 to-indigo-100 p-4 overflow-y-auto">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-8 my-8">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-3xl font-bold text-gray-800">Parental Provider Evaluation Form</h2>
                <button onClick={() => {setShowEvaluationForm(false); setEvaluationType(null);}} className="text-gray-500 hover:text-gray-700">
                  <XCircle className="w-6 h-6" />
                </button>
              </div>
              <form onSubmit={handleSubmitParentalEval} className="space-y-6">
                <div className="grid grid-cols-2 gap-4">

                    const dateValue = e.target.value;
                    console.log('Date selected:', dateValue);
                    console.log('Currently booked dates:', bookedDates);
                    if (dateValue) {
                      // Parse date parts to avoid timezone issues
                      const [year, month, day] = dateValue.split('-').map(Number);
                      const date = new Date(year, month - 1, day);
                      const dayOfWeek = date.getDay();
                      console.log('Day of week:', dayOfWeek, '(0=Sunday, 6=Saturday)');
                      
                      // Check if Sunday (0 = Sunday)
                      if (dayOfWeek === 0) {
                        alert('Sorry, we do not schedule visits on Sundays. Please select another date.');
                        setSelectedDate('');
                        return;
                      }
                      
                      // Check if date is already booked
                      const isBooked = bookedDates.includes(dateValue);
                      console.log('Is date booked?', isBooked);
                      if (isBooked) {
                        alert('Sorry, this date is already booked. Please select another date.');
                        setSelectedDate('');
                        return;
                      }
                    }
                    setSelectedDate(dateValue);
                  }}
                  min={today}
                  max={maxDateStr}
                  className={`w-full px-4 py-3 border ${errors.date ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all`}
                />
                {errors.date && <p className="mt-1 text-sm text-red-600">{errors.date}</p>}
                <p className="mt-2 text-xs text-gray-500">We'll confirm availability for your preferred date (No Sundays)</p>
                {bookedDates.length > 0 && (
                  <p className="mt-1 text-xs text-amber-600">
                    ⚠️ Some dates may be unavailable due to confirmed bookings
                  </p>
                )}
              </div>

              <div>
                <label htmlFor="time" className="block text-sm font-medium text-gray-700 mb-2">
                  Preferred Visit Time *
                </label>
                <input
                  type="time"
                  id="time"
                  value={selectedTime}
                  onChange={(e) => setSelectedTime(e.target.value)}
                  className={`w-full px-4 py-3 border ${errors.time ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all`}
                />
                {errors.time && <p className="mt-1 text-sm text-red-600">{errors.time}</p>}
                <p className="mt-2 text-xs text-gray-500">Select your preferred appointment time</p>
              </div>

              <div>
                <label htmlFor="notes" className="block text-sm font-medium text-gray-700 mb-2">
                  Additional Notes (Optional)
                </label>
                <textarea
                  id="notes"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  rows="3"
                  className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all resize-none"
                  placeholder="Any special requirements or preferences..."
                />
              </div>

              <button
                onClick={handleSubmit}
                disabled={loading}
                className={`w-full py-3 px-6 rounded-lg font-semibold transition-colors duration-200 shadow-lg hover:shadow-xl ${
                  loading 
                    ? 'bg-gray-400 text-gray-200 cursor-not-allowed' 
                    : 'bg-indigo-600 text-white hover:bg-indigo-700'
                }`}
              >
                {loading ? 'Submitting...' : 'Confirm Preferred Visit Date & Time'}
              </button>
            </div>
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HomeVisitScheduler />);
  </script>
</body>
</html>
